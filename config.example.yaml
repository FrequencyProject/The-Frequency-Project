# ==============================================================================
# 📊 VIVIC EDGE AI INGESTION ENGINE: MASTER PRODUCTION CONFIGURATION
# ==============================================================================
# This template defines the operational limits, physical device anchors, and 
# telemetry monitoring thresholds required for high-assurance edge environments.

# --- HARDWARE TELEMETRY INTERFACE ---
serial:
  port: "/dev/ttyUSB0"      # Canonical path to physical UART/USB serial bridge link
  baudrate: 115200          # Hardware baud execution clock synchronization rate
  timeout: 5.0              # Strict float boundary ceiling (seconds) for blocking reads

# --- INGESTION BUFFER PARAMETERS ---
ingestion:
  sample_rate_hz: 60.0       # Target ingestion frequency anchor (~60Hz telemetry rate)
  window_size_samples: 1280  # Sliding deque ring-buffer memory capacity window
  channels: 4                # Number of isolated physical hardware telemetry tracks

# --- SYSTEM CALIBRATION PARAMETERS ---
calibration:
  sweep_duration_seconds: 120.0     # Duration of Quiet State Sweep to map ambient limits
  auto_calibrate_on_startup: true   # Automatically trigger baseline mapping on boot

# --- DEEP LEARNING MONITORING THRESHOLDS ---
monitoring:
  anomaly_sigma_threshold: 3.0      # Strict 3-Sigma mathematical threshold boundary limit
  metrics_export_port: 8000         # Non-privileged port allocation for HTTP metrics endpoint
  health_check_timeout: 2.0         # Socket connection hold threshold for container probes

# --- HARDWARE SECURITY MODULE (TPM 2.0) ---
tpm:
  enabled: true                     # Enable structural hardware vault integration
  tcti_socket_port: 2321            # Transport connection port linking to local swtpm emulator
  retry_attempts: 3                 # Automatic retry ceiling parameter for transient SPI bus lag
  retry_backoff_ms: 100             # Settling timeout duration (milliseconds) between retries
