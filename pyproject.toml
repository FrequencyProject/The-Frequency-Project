[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# S101: Allows using assert statements in your testing files
# E501: Ignores line-length limits specifically for long comments/docstrings
ignore = ["S101", "E501"]

[tool.ruff.lint.isort]
# Automatically groups and sorts imports alphabetically to clear I001 warnings
combine-as-imports = true
