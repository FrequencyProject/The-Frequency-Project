[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-potential-ai-ingestion"
version = "1.0.0"
description = "A 4-channel multi-modal biological frequency ingestion pipeline for AI model training."
readme = "README.md"
authors = [
    { name = "Engineering Core", email = "core@hardware.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyserial>=3.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black==24.10.0",
    "mypy>=1.3.0",
    "ruff==0.14.1"
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
no_site_packages = true
warn_return_any = true
warn_unused_configs = true

# Suppress return issues where loose third-party typing defaults to Any
disable_error_code = ["no-any-return"]

# Completely insulate the runner from third-party type stub syntax anomalies
[[tool.mypy.overrides]]
module = ["scipy.*", "serial.*"]
ignore_missing_imports = true
follow_imports = "skip"
