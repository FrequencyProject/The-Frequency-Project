# ==============================================================================
# 🌌 VIVIC AI ARCHITECTURE SPECIFICATION SHEET
# [PROTECTED BY AN INTEGRATED INFRASTRUCTURE ENCLOSURE MANDATE]
# ==============================================================================

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-frequency-project"
version = "1.0.0"
description = "Non-Semantic, Threat-Insulated Ecological Frequency Ingestion Matrix"
readme = "README.md"
requires-python = ">=3.10"

license = "AGPL-3.0"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

# HARDENING REMEDIATION: Lock the pytest-env plugin directly into the master package 
# dependencies array to guarantee automated single-thread speed protections on remote GitHub CI nodes.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "torch==2.2.1",
    "tpm2-pytss>=2.3.0",
    "pyserial>=3.5",
    "pytest-env>=1.1.0",
    "pytest-env"
]

[tool.setuptools]
py-modules = [
    "crypto_signer",
    "latent_monitor",
    "model_architecture",
    "protect_vault",
    "prototype_simulation",
    "resonance_loss",
    "run_session",
    "secure_hardware_vault",
    "sensor_adapter",
    "serial_daemon",
    "spectral_processing",
    "stress_harness",
    "train_engine",
    "unseal_hardware_vault",
    "package_discovery_fix",
    "validate_config"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Force the testing engine to lock PyTorch and OpenMP linear algebra backends 
# to a single thread, eliminating multi-core scheduling thrashing cleanly.
env = [
    "OMP_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "OPENBLAS_NUM_THREADS=1",
    "VECLIB_MAXIMUM_THREADS=1",
    "NUMEXPR_NUM_THREADS=1"
]
