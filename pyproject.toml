[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Selects standard Error (E) and Warning (W) style rules
select = ["E", "F", "W"]
# S101: Allows assert statements in your testing folder
# E501: Ignores rigid line-lengths inside long docstrings or print notes
ignore = ["S101", "E501"]
