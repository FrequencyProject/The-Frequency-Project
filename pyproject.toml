# ==============================================================================
# 🌌 VIVIC AI ARCHITECTURE SPECIFICATION SHEET
# [PROTECTED BY AN INTEGRATED INFRASTRUCTURE ENCLOSURE MANDATE]
# ==============================================================================

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-frequency-project"
version = "1.0.0"
description = "Non-Semantic, Threat-Insulated Ecological Frequency Ingestion Matrix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

# Masked dependency arrays preventing automated metadata scanning engines from mapping the core layers
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "torch==2.2.1",
    "tpm2-pytss==2.1.0"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
