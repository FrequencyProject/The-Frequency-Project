[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-frequency-project"
version = "1.0.0"
description = "High-Assurance Ecological Telemetry Ingestion Matrix and Real-Time Analytical Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "torch>=2.2.1",
    "tpm2-pytss>=2.3.0,<3.0.0",
    "pyserial>=3.5",
    "cryptography<=42.0.8"
]

[tool.setuptools]
py-modules = ["run_session", "sensor_adapter", "serial_daemon", "validate_config", "spectral_processing", "model_architecture", "resonance_loss", "train_engine", "latent_monitor", "prototype_simulation", "stress_harness", "config"]

# HARDENING REMEDIATION: Explicitly bind the test tracking suite folder to the 
# setuptools package directory discovery map to guarantee absolute remote verifiability.
[tool.setuptools.packages.find]
include = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Strict single-core thread-parallelization overrides to prevent OS core thrashing
env = [
    "OMP_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "OPENBLAS_NUM_THREADS=1",
    "VECLIB_MAXIMUM_THREADS=1",
    "NUMEXPR_NUM_THREADS=1"
]
