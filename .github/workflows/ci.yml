name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install numpy pytest black ruff

    - name: Run Code Formatting Check
      run: black --check .
      continue-on-error: true

    - name: Run Linter Audit
      run: ruff check .
      continue-on-error: true

    - name: Run Automated Test Suite
      run: |
        if [ -f tests/test_ingest.py ]; then
          pytest tests/test_ingest.py -q
        elif [ -f test_pipeline.py ]; then
          pytest test_pipeline.py -q
        else
          pytest -q
        fi

    - name: Run Pipeline Validation
      run: python prototype_simulation.py --debug
