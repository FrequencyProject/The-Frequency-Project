name: Continuous Integration Security & Regression Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository source tree files
      uses: actions/checkout@v4

    - name: Provision system dependencies and TPM headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev build-essential tpm2-tools

    - name: Configure Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Verify pinned third-party dependencies wheel compilation
      run: |
        python -m pip install --upgrade pip setuptools cffi
        pip install flake8 bandit pip-audit cyclonedx-bom
        pip install -r requirements.txt

    - name: Run Code Quality Security Audit (Flake8)
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Catch programmatic bugs while masking arithmetic and import layout noise
        flake8 . --count --ignore=W291,W293,E501,E261,E302,E305,E226,W292,F401,C901,E203,E402,F541 --statistics --exclude=venv,.git,__pycache__,build,dist

    - name: "HARDENING REMEDIATION: Automated Dependency Vulnerability Scanning (pip-audit)"
      run: pip-audit -r requirements.txt

    - name: "HARDENING REMEDIATION: Automated Code Security Scanning (Bandit)"
      run: bandit -r . -x ./venv,./tests -ll

    - name: "HARDENING REMEDIATION: Supply Chain Software Bill of Materials (SBOM) Generation"
      run: cyclonedx-py requirements requirements.txt --of XML -o bom.xml

    - name: Install Local Project Module Package Layout
      run: pip install -e .

    - name: Execute validation configuration checks
      run: python validate_config.py

    - name: Run Core PyTest Matrix Suite
      run: python -m pytest

    # HARDENING REMEDIATION: Clear out storage visibility indicators to track resource pressure
    - name: Monitor Local Runner Storage Footprint
      run: df -h

    # HARDENING REMEDIATION: Force native compilation under strict execution budgets to bypass QEMU stalls
    - name: Validate Production Container Image Build Architecture
      timeout-minutes: 10
      run: |
        docker build --progress=plain --network=host -t the-frequency-project:test .
