name: Continuous Integration Security & Regression Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source tree files
        uses: actions/checkout@v4

      - name: Provision system dependencies and TPM headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev build-essential tpm2-tools

      - name: Configure Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned third-party dependencies wheel compilation
        run: |
          python -m pip install --upgrade pip setuptools cffi
          pip install flake8 bandit pip-audit cyclonedx-bom
          pip install -r requirements.txt

      - name: Run Code Quality Security Audit (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --statistics

      - name: Automated Dependency Vulnerability Scanning (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Automated Code Security Scanning (Bandit)
        run: bandit -r . -x ./venv,./tests -ll

      - name: Supply Chain Software Bill of Materials (SBOM) Generation
        run: cyclonedx-py requirements requirements.txt --of XML -o bom.xml

      - name: Install Local Project Module Package Layout
        run: pip install -e .

      - name: Execute validation configuration checks
        run: python validate_config.py

      - name: Run Core PyTest Matrix Suite
        run: python -m pytest

      - name: Validate Container Deployment Runtime Integrity
        run: |
          set -Eeuo pipefail

          container_name=frequency-runtime-test

          cleanup() {
            status=$?
            echo "=== CONTAINER DIAGNOSTICS ==="
            docker inspect "$container_name" --format='status={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}}' 2>/dev/null || true
            
            echo "=== CONTAINER RUNTIME LOGS ==="
            docker logs "$container_name" 2>&1 || true
            
            docker rm -f "$container_name" 2>/dev/null || true
            exit "$status"
          }

          trap cleanup EXIT

          docker build -t the-frequency-project:ci-gate .

          docker run -d \
            --name "$container_name" \
            -p 8080:8080 \
            the-frequency-project:ci-gate

          # Wait until the endpoint is ready, while preserving useful diagnostics.
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail \
                --connect-timeout 2 \
                http://127.0.0.1:8080/metrics; then
              echo "=== SUCCESS: CONTAINER RUNTIME RESPONSE VERIFIED ==="
              exit 0
            fi

            if ! docker inspect "$container_name" --format '{{.State.Running}}' | grep -q true; then
              echo "=== ERROR: Container exited prematurely ==="
              exit 1
            fi

            sleep 2
          done

          echo "=== ERROR: Container timed out without becoming ready ==="
          exit 1

      - name: Execute Automated Container Runtime Smoke Test
        run: |
          set -euxo pipefail
          # 1. Spin up the production image in an isolated background container
          docker run -d --name frequency-runtime-test -p 8000:8000 the-frequency-project:ci-gate
          # 2. Provide a 5-second initialization window for config verification
          sleep 5
          # 3. Verify container responsiveness and log outputs
          docker ps
          docker logs frequency-runtime-test
          # 4. Tear down the test container safely
          docker rm -f frequency-runtime-test
