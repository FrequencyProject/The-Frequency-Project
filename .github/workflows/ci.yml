name: Continuous Integration Security & Regression Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source tree files
        uses: actions/checkout@v4

      - name: Provision system dependencies and TPM headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev build-essential tpm2-tools

      - name: Configure Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned third-party dependencies wheel compilation
        run: |
          python -m pip install --upgrade pip setuptools cffi
          pip install flake8 bandit pip-audit cyclonedx-bom
          pip install -r requirements.txt

      - name: Run Code Quality Security Audit (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --statistics

      - name: Automated Dependency Vulnerability Scanning (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Automated Code Security Scanning (Bandit)
        run: bandit -r . -x ./venv,./tests -ll

      - name: Supply Chain Software Bill of Materials (SBOM) Generation
        run: cyclonedx-py requirements requirements.txt --of XML -o bom.xml

      - name: Install Local Project Module Package Layout
        run: pip install -e .

      - name: Execute validation configuration checks
        run: python validate_config.py

      - name: Run Core PyTest Matrix Suite
        run: python -m pytest

      - name: Verify Production Container Build Stability
        run: |
          set -euxo pipefail
          df -h
          free -h
          docker system df
          docker build --progress=plain -t the-frequency-project:ci-gate .

      # HARDENING REMEDIATION: Execute a non-root runtime container smoke test validation pass
      - name: Validate Container Deployment Runtime Integrity
        run: |
          set -euxo pipefail
          # 1. Launch the compiled production container in background detached mode
          docker run -d --name frequency-runtime-test -p 8080:8080 the-frequency-project:ci-gate
          
          # 2. Allow the internal configuration validations and session initialization to settle
          sleep 5
          
          # 3. Query the core Prometheus metrics diagnostic endpoint to prove operational readiness
          curl --fail --connect-timeout 5 --retry 3 http://localhost:8080/metrics
          
          # 4. Dump the runtime container logs to the CI output for transparency
          docker logs frequency-runtime-test
          
          # 5. Clean up the testing runner instance cleanly
          docker rm -f frequency-runtime-test
