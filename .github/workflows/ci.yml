name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  functional-tests:
    name: Code Execution and Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Ingestion Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Verified Test Suite
      run: python -m pytest tests/ -q

    - name: Run Pipeline Validation
      run: python prototype_simulation.py --debug

  style-audit:
    name: Code Formatting and Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linter Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.3.0 ruff

    - name: Automatically Align Code Layout
      run: |
        black prototype_simulation.py sensor_adapter.py tests/
        ruff check prototype_simulation.py sensor_adapter.py tests/
