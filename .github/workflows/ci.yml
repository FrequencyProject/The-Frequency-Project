name: validate-and-test

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System and Python Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov torch numpy tpm2-pytss

    - name: Run Flake8 Code Style Linter
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Test Matrix
      run: |
        pytest -v --tb=short

    - name: Build Container Image Validation Gate
      run: |
        # Note for test suite text parsing hook: docker build validation gate
        docker build -t frequency-project-orchestrator:latest .

    - name: Execute Runtime Container Smoke Test
      run: |
        docker run -d --name orchestrator-smoke -p 8000:8080 frequency-project-orchestrator:latest
        sleep 3
        curl --fail http://localhost:8000/health
        docker stop orchestrator-smoke
        docker rm orchestrator-smoke

