name: Phase 8 Continuous Integration Pipeline

on:
  push:
    branches: [ clean-production-run ]
  pull_request:
    branches: [ clean-production-run ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository source tree files
      uses: actions/checkout@v4

    - name: Provision system dependencies and TPM headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev build-essential tpm2-tools

    - name: Configure Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Verify pinned third-party dependencies wheel compilation
      run: |
        python -m pip install --upgrade pip setuptools cffi
        pip install -r requirements.txt

    - name: Execute validation configuration checks
      run: python validate_config.py

    - name: Run Core PyTest Matrix Suite
      run: python -m pytest
