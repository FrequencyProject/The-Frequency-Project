name: Continuous Integration

on:
  push:
    branches: [ clean-production-run ]
  pull_request:
    branches: [ clean-production-run ]

jobs:
  functional-tests:
    name: Code Execution and Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ingestion Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Verified Test Suite
      run: python -m pytest tests/ -q

    - name: Run Pipeline Validation
      run: python prototype_simulation.py --debug

  style-audit:
    name: Code Formatting and Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linter Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.10.0 ruff==0.14.1

    - name: Verify Code Style Integrity
      run: |
        black --check prototype_simulation.py sensor_adapter.py tests/
        ruff check prototype_simulation.py sensor_adapter.py tests/
