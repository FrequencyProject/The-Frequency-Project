name: Continuous Integration Security & Regression Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository source tree files
      uses: actions/checkout@v4

    # HARDENING REMEDIATION: Wipe pre-installed runner bloat to instantly free up 15GB+ of disk space.
    - name: Decompress Host Disk Capacity
      run: |
        echo "=== STORAGE DISK SPACE BEFORE PURGE ==="
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get clean
        docker system prune -af --volumes || true
        echo "=== STORAGE DISK SPACE AFTER PURGE ==="
        df -h

    - name: Provision system dependencies and TPM headers
      timeout-minutes: 5
      run: |
        export DEBIAN_FRONTEND=noninteractive
        export NEEDRESTART_MODE=a
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o Dpkg::Options::="--force-confdef" \
          -o Dpkg::Options::="--force-confold" \
          libtss2-dev build-essential tpm2-tools

    - name: Configure Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # HARDENING REMEDIATION: Consolidated into a single call to satisfy tests/test_ci_workflow.py 
    # while retaining cache suppression and CPU-only PyTorch index overrides to prevent disk leaks.
    - name: Install Python dependencies and CI tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --no-cache-dir --extra-index-url https://pytorch.org -r requirements.txt flake8 bandit pip-audit cyclonedx-bom

    - name: Run Code Quality Security Audit (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --ignore=W291,W293,E501,E261,E302,E305,E226,W292,F401,C901,E203,E402,F541 --statistics --exclude=venv,.git,__pycache__,build,dist

    - name: "HARDENING REMEDIATION: Automated Dependency Vulnerability Scanning (pip-audit)"
      run: pip-audit -r requirements.txt

    - name: "HARDENING REMEDIATION: Automated Code Security Scanning (Bandit)"
      run: bandit -r . -x ./venv,./tests -ll

    - name: "HARDENING REMEDIATION: Supply Chain Software Bill of Materials (SBOM) Generation"
      run: cyclonedx-py requirements requirements.txt --of XML -o bom.xml

    - name: Install Local Project Module Package Layout
      run: pip install -e .

    - name: Execute validation configuration checks
      run: python validate_config.py

    - name: Run Core PyTest Matrix Suite
      run: python -m pytest

    - name: Validate Production Container Image Build Architecture
      timeout-minutes: 15
      run: |
        docker system prune -af --volumes || true
        echo "=== FINAL STORAGE AVAILABILITY FOR CONTAINER OVERVIEW ==="
        df -h
        docker build --progress=plain --platform linux/amd64 --network=host -t the-frequency-project:test .
