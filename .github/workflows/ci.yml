name: Continuous Integration Gate

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: Construct Core Container Runtime Image
        run: |
          docker build -t the-frequency-project:ci-gate .

      - name: Execute Automated Container Runtime Smoke Test
        run: |
          set -euxo pipefail

          # 1. Initialize container mapping external port 8000 to internal application port 8080
          docker run -d \
            --name frequency-runtime-test \
            -p 8000:8080 \
            the-frequency-project:ci-gate

          # 2. Register global container teardown and log tracing safety trap
          trap 'docker logs frequency-runtime-test || true; docker rm -f frequency-runtime-test || true' EXIT

          # 3. High-frequency polling block to capture endpoints before simulation teardown
          echo "Entering high-assurance container polling matrix..."
          for attempt in $(seq 1 15); do
            # Probe health metrics using local system loopback structure
            if curl --fail --connect-timeout 2 http://127.0.0; then
              echo "[SUCCESS] Container service resolved and operational."
              break
            fi

            if [ "$attempt" -eq 15 ]; then
              echo "[ERROR] Service gateway failed to respond on port 8000 within timeout parameters."
              exit 1
            fi

            sleep 2
          done

          # 4. Final functional telemetry assertion
          echo "Asserting metrics ingestion stream capacity..."
          curl --fail --connect-timeout 2 http://127.0.0
