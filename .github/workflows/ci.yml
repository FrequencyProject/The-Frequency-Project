name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Set up Pipeline Cache
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Test Dependencies (Excluding Heavy ML Wheels)
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy pytest black mypy
        
    - name: Run Code Style Checks (Black Linter)
      run: |
        black --check prototype_simulation.py test_pipeline.py sensor_adapter.py

    - name: Run Static Code Type Verification (Mypy)
      run: |
        mypy --ignore-missing-imports prototype_simulation.py test_pipeline.py sensor_adapter.py

    - name: Run Mathematical Verification Tests
      run: |
        pytest test_pipeline.py
