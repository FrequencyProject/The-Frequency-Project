name: Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Runtime and Validation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black mypy tomli numpy pyserial pytest

    - name: Enforce Code Style Formatting (Black)
      run: |
        black --check .

    - name: Enforce Static Type Integrity (Mypy)
      run: |
        mypy --ignore-missing-imports .

    - name: Execute Repository Configuration Validation Script
      run: |
        if [ -f validate_config.py ]; then
          python validate_config.py
        else
          echo "[ERROR] System validation script missing from repository root."
          exit 1
        fi


