name: Continuous Integration Security & Regression Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository source tree files
      uses: actions/checkout@v4

    - name: Provision system dependencies and TPM headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev build-essential tpm2-tools

    - name: Configure Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Verify pinned third-party dependencies wheel compilation
      run: |
        python -m pip install --upgrade pip setuptools cffi
        pip install flake8 pytest-env
        # Fallback handling to ensure setup configuration reads correctly
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Code Quality Security Audit (Flake8)
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Stylistic and complexity warnings processed as warning outputs
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Install Local Project Module Package Layout
      run: pip install -e .

    - name: Execute validation configuration checks
      run: python validate_config.py

    - name: Run Core PyTest Matrix Suite (Includes Extended Hypothesis Checks)
      run: python -m pytest

    # ============================================================================
    # 🟢 HARDENING REMEDIATION: Automated Preregistered Hypothesis Logger
    # ============================================================================
    - name: Run Preregistered Phi Hypothesis Baseline Report
      run: |
        # Executes the 3,600-frame rapid simulation pass to print frequentist matrices 
        # and logs results into the active CI timeline outputs directly.
        python validate_phi_hypothesis.py
      continue-on-error: true # Document and track mathematical drift without breaking build lines

    # ============================================================================
    # 🟢 HARDENING REMEDIATION: Automated Containerization and Deployment Story
    # ============================================================================
    - name: Build Local Docker Container Infrastructure
      run: |
        docker build -t frequency-project:latest .

    - name: Run Containerized Whole-System Smoke-Test
      run: |
        # Validates that the application launches, handles system paths, and executes
        # its top-level integration dry run inside an isolated Linux container baseline.
        docker run --env OMP_NUM_THREADS=1 frequency-project:latest python prototype_simulation.py
