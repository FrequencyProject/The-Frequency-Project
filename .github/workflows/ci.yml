name: Continuous Integration Validation Matrix

on:
  push:
    branches: [ "clean-production-run" ]
  pull_request:
    branches: [ "clean-production-run" ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code Repository Base
      uses: actions/checkout@v4

    - name: Mount Python Execution Matrix Environs
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Provision Host Native TPM Cryptographic Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev pkg-config

    - name: Hardened Dependency Installation & Package Alignment
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
