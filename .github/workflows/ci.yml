name: Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, development, clean-production-run ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime (Matrix Control)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Pinned Matrix Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.10.0 ruff==0.14.1 numpy>=1.24.0,<2.0.0 pyserial>=3.5 pytest
        if [ "${{ matrix.python-version }}" = "3.10" ]; then
          pip install tomli
        fi

    - name: Enforce Code Style Formatting (Black)
      run: |
        black --check .

    - name: Enforce Code Quality Audit (Ruff)
      run: |
        ruff check .

    - name: Execute Repository Configuration Validation Script
      run: |
        if [ -f validate_config.py ]; then
          python validate_config.py
        else
          echo "[ERROR] System validation script missing from repository root."
          exit 1
        fi
