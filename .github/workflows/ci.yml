name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  functional-tests:
    name: Code Execution and Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Ingestion Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Verified Test Suite
      run: python -m pytest tests/ -q

    - name: Run Pipeline Validation
      run: python prototype_simulation.py --debug

  style-audit:
    name: Code Formatting and Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Crucial: Fetches full history so the server can push code commits back cleanly
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linter Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.3.0 ruff

    - name: Automatically Format and Commit Changes
      run: |
        # Configures a generic GitHub robot profile to sign the commit safely
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Executes the exact formatting layout Black demands
        black prototype_simulation.py sensor_adapter.py tests/
        ruff check --fix prototype_simulation.py sensor_adapter.py tests/ || true
        
        # Automatically stages, signs, and pushes the formatted code back into your branch
        git add prototype_simulation.py sensor_adapter.py tests/
        git diff-index --quiet HEAD || git commit -m "Apply automated Black formatting constraints"
        git push origin HEAD:${{ github.head_ref || github.ref_name }}
