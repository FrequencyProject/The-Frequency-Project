name: Continuous Integration Validation Pipeline

on:
  push:
    branches: [ clean-production-run, sandbox/harden-ci-matrix ]
  pull_request:
    branches: [ clean-production-run ]

jobs:
  validate-ecosystem:
    name: Execute Core Technical Infrastructure Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python (${{ matrix.python-version }})
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Style Check (Black)
      run: |
        black --check prototype_simulation.py sensor_adapter.py spectral_processing.py serial_daemon.py validate_config.py tests/

    - name: Repository Configuration Audit
      run: |
        python validate_config.py
