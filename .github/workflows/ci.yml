name: Continuous Integration Validation Matrix

on:
  push:
    branches: [ "clean-production-run" ]
  pull_request:
    branches: [ "clean-production-run" ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code Repository Base
      uses: actions/checkout@v4

    - name: Mount Python Execution Matrix Environs
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Cryptographic Headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev libtss2-esapi-dev

    - name: Hardened Dependency Installation & Package Alignment
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ matrix.python-version }}" = "3.10" ]; then
          pip install 'tomli>=2.0.1'
        fi

    - name: Verify Code Style Compliance Gates
      run: |
        black --check crypto_signer.py serial_daemon.py sensor_adapter.py train_engine.py resonance_loss.py run_session.py stress_harness.py tests/

    - name: Execute Repository Configuration Audit
      run: |
        python validate_config.py

    - name: Run Whole-System Testing Matrix
      run: |
        python -m pytest -v
