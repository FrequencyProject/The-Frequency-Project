name: Continuous Integration Gate

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Note: Node 20 deprecation notices from standard actions are benign infrastructure warnings.
      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: Construct Core Container Runtime Image
        run: |
          docker build -t the-frequency-project:ci-gate .

      - name: Execute Automated Container Runtime Smoke Test
        run: |
          set -euxo pipefail

          # 1. Map host 8000 securely to application native 8080 
          docker run -d \
            --name frequency-runtime-test \
            -p 8000:8080 \
            the-frequency-project:ci-gate

          # 2. Establish high-assurance logging/removal cleanup track
          trap 'docker logs frequency-runtime-test || true; docker rm -f frequency-runtime-test || true' EXIT

          # 3. High-frequency polling block explicitly targeted at the host bridge port
          echo "Waiting for metrics endpoint..."
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              --connect-timeout 2 \
              http://127.0.0.1:8000/metrics; then
              echo "[SUCCESS] Container service resolved and operational."
              break
            fi

            if [ "$attempt" -eq 15 ]; then
              echo "[ERROR] Service failed to respond on port 8000 within timeout bounds."
              exit 1
            fi

            sleep 2
          done

          # 4. Final verification metric stream sweep
          echo "Asserting metrics ingestion stream capacity..."
          curl --fail --silent --show-error \
            --connect-timeout 2 \
            http://127.0.0.1:8000/metrics
