name: Vivic Core CI

on:
  push:
    branches: [ main, Back-up, clean-production-run ]
  pull_request:
    branches: [ main, Back-up, clean-production-run ]

jobs:
  validate-ecosystem:
    name: Validate Ecosystem (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python (${{ matrix.python-version }})
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Style Check (Black)
        run: |
          black --check prototype_simulation.py sensor_adapter.py spectral_processing.py serial_daemon.py validate_config.py tests/

      - name: Static Lint Analysis (Ruff)
        run: |
          ruff check .

      - name: Type Safety Verification (Mypy)
        run: |
          python -m mypy sensor_adapter.py spectral_processing.py serial_daemon.py validate_config.py prototype_simulation.py

      - name: Execute Full Test Suite (Pytest)
        run: |
          pytest -q

      - name: Run Pipeline Validation
        run: |
          python prototype_simulation.py --debug

      - name: Repository Configuration Audit
        run: |
          python validate_config.py
